# wrangler.toml
# Cloudflare Worker configuration for СВК Авто AI Blog & Chat

name = "svkauto-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "svkauto-db"
database_id = "3a1458a2-20f4-4126-9f03-8a9714235d54"

# Environment variables (secrets should be set via `wrangler secret put`)
[vars]
SITE_BASE_URL = "https://svk-avto.ru"
ADMIN_USERNAME = "admin"
GITHUB_OWNER = "ruport998-sudo"
GITHUB_REPO = "SVK-avto"
GITHUB_BRANCH = "main"

# Secrets (set via wrangler secret put):
# ADMIN_PASSWORD
# GROQ_API_KEY
# GITHUB_TOKEN
# CHAT_AUTH_TOKEN
# TURNSTILE_SECRET_KEY
# INDEXNOW_KEY

# Cron triggers for AI blog
[triggers]
crons = ["5 6 * * *"]
