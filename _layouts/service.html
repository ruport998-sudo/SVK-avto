---
layout: default
---

<article class="service-page">
  <header class="service-header">
    <div class="container">
      {% include breadcrumbs.html %}
      
      <h1>{{ page.title }} в Москве</h1>
      <p class="service-intro">{{ page.description }}</p>
    </div>
  </header>
  
  <div class="service-content">
    <div class="container">
      <!-- Dynamic prices loaded from API -->
      <div data-service-prices data-category="{{ page.name }}">
        <div class="prices-loading">
          <div class="spinner"></div>
          <span>Загрузка цен...</span>
        </div>
      </div>

      {{ content }}
    </div>
  </div>

  
  <footer class="service-footer">
    <div class="container">
      <div class="service-cta">
        <h3>Запишитесь на {{ page.title | downcase }}</h3>
        <p>Позвоните или оставьте заявку — перезвоним в течение 30 минут.</p>
        <div class="cta-buttons">
          <a href="tel:+74957223627" class="btn btn-primary">Позвонить: +7 (495) 722‑36‑27</a>
          <a href="/contacts/" class="btn btn-outline">Записаться онлайн</a>
        </div>
      </div>
    </div>
  </footer>
</article>

<!-- Service Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Service",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | jsonify }},
  "provider": {
    "@type": "AutoRepair",
    "name": "СВК Авто",
    "url": "{{ site.url }}",
    "telephone": "+7-495-722-36-27",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "ул. Поклонная, д. 11, стр. 4",
      "addressLocality": "Москва",
      "addressCountry": "RU"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": "55.7365",
      "longitude": "37.3785"
    }
  },
  "areaServed": {
    "@type": "City",
    "name": "Москва",
    "containedInPlace": {
      "@type": "AdministrativeArea",
      "name": "Московская область"
    }
  },
  "serviceType": "{{ page.title }}",
  "offers": {
    "@type": "Offer",
    "availability": "https://schema.org/InStock",
    "areaServed": {
      "@type": "GeoCircle",
      "geoMidpoint": {
        "@type": "GeoCoordinates",
        "latitude": "55.7365",
        "longitude": "37.3785"
      },
      "geoRadius": "30000"
    }
  },
  "termsOfService": "Точная стоимость определяется после осмотра и согласовывается с клиентом до начала работ."
}
</script>
