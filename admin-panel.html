    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      background: #f5f5f5;
      color: #222;
      padding: 20px;

    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .login-form {

    }
    .login-form h2 { margin-bottom: 20px; }
    .login-form input {
      width: 100%; padding: 10px 14px; margin-bottom: 12px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 15px;
    }
    .login-form button {
      width: 100%; padding: 12px; background: #0d4d99; color: #fff;
      border: none; border-radius: 8px; font-size: 16px; cursor: pointer;
    }
    .login-form button:hover { background: #0a3d7a; }
    .login-error { color: #d32f2f; margin-top: 8px; font-size: 14px; display: none; }
    .admin-panel { display: none; }
    .admin-panel.show { display: block; }
    .login-form.hide { display: none; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .toolbar button {
      padding: 10px 20px; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer;
    }
    .btn-save { background: #0d4d99; color: #fff; }
    .btn-save:hover { background: #0a3d7a; }
    .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-reset { background: #e0e0e0; color: #333; }
    .btn-reset:hover { background: #ccc; }
    .btn-logout { background: #d32f2f; color: #fff; }
    .btn-logout:hover { background: #b71c1c; }
    .save-status {
      padding: 8px 16px; border-radius: 8px; font-size: 14px;
      display: none; margin-bottom: 16px;
    }
    .save-status.success { display: block; background: #e8f5e9; color: #2e7d32; }
    .save-status.error { display: block; background: #ffebee; color: #c62828; }
    .save-status.loading { display: block; background: #e3f2fd; color: #1565c0; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    th { background: #f8f9fa; text-align: left; padding: 12px 16px; font-size: 13px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #eee; }
    td { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:hover td { background: #fafafa; }
    td input, td textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; transition: border-color 0.2s;
    }
    td input:focus, td textarea:focus { outline: none; border-color: #0d4d99; }
    td textarea { resize: vertical; min-height: 36px; }
    .category-badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
    }
    .category-main { background: #e3f2fd; color: #1565c0; }
    .category-to { background: #e8f5e9; color: #2e7d32; }
    .category-diagnostics { background: #fff3e0; color: #e65100; }
    .category-engine { background: #fce4ec; color: #c62828; }
    .category-suspension { background: #f3e5f5; color: #6a1b9a; }
    .category-brakes { background: #e0f2f1; color: #00695c; }
    .category-transmission { background: #fbe9e7; color: #bf360c; }
    .category-ac { background: #e1f5fe; color: #0277bd; }
    .category-body { background: #fff8e1; color: #f57f17; }
    .category-tires { background: #e8eaf6; color: #283593; }
    .category-polishing { background: #fce4ec; color: #880e4f; }
    .category-extras { background: #f1f8e9; color: #558b2f; }
    .category-wheel-alignment { background: #ede7f6; color: #4527a0; }
    .loading-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.8); z-index: 1000;
      justify-content: center; align-items: center; font-size: 18px;
    }
    .loading-overlay.show { display: flex; }
    .loading-spinner {
      width: 40px; height: 40px; border: 4px solid #e0e0e0;
      border-top-color: #0d4d99; border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .unsaved-indicator {
      display: none; font-size: 13px; color: #e65100; margin-left: 8px;
    }
    .unsaved-indicator.show { display: inline; }
    @media (max-width: 768px) {
      body { padding: 8px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 13px; margin-bottom: 16px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar button { width: 100%; padding: 12px 16px; font-size: 15px; }
      table, thead, tbody, th, td, tr { display: block; }
      thead { display: none; }
      tr { background: #fff; margin-bottom: 12px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); padding: 12px; }

      td { padding: 4px 0; border: none; display: flex; flex-direction: column; gap: 2px; }
      td::before { content: attr(data-label); font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
      td input, td textarea { font-size: 16px; padding: 10px 12px; }

    .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid #e0e0e0; }
    .tab-btn { padding: 10px 24px; border: none; background: none; font-size: 15px; font-weight: 500; cursor: pointer; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab-btn.active { color: #0d4d99; border-bottom-color: #0d4d99; }
    .tab-btn:hover { color: #0d4d99; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    /* Promo cards editing */

    .promo-card-edit input, .promo-card-edit textarea { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
    .promo-card-edit textarea { resize: vertical; min-height: 60px; }
    .promo-card-edit .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .promo-card-edit .badge-select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; }

    .promo-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .promo-card-header h4 { font-size: 15px; margin: 0; }
    @media (max-width: 768px) {
      .promo-card-edit .field-row { grid-template-columns: 1fr; }
      .tabs { overflow-x: auto; }
      .tab-btn { padding: 8px 16px; font-size: 13px; white-space: nowrap; }

        document.getElementById('adminPanel').classList.add('show');
        document.getElementById('loginError').style.display = 'none';
        loadPrices();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function logout() {
      sessionStorage.removeItem('svk_admin_local');
      isLoggedIn = false;
      document.getElementById('loginForm').classList.remove('hide');
      document.getElementById('adminPanel').classList.remove('show');
    }

    function loadPrices() {
      const container = document.getElementById('tableContainer');
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Загрузка...</div>';
      
      // Загружаем из localStorage или используем начальные данные
      const saved = localStorage.getItem('svk_prices_admin_data');
      if (saved) {
        try {
          pricesData = JSON.parse(saved);
        } catch {
          pricesData = JSON.parse(JSON.stringify(DEFAULT_PRICES));
        }
      } else {
        pricesData = JSON.parse(JSON.stringify(DEFAULT_PRICES));
      }
      
      originalPricesData = JSON.parse(JSON.stringify(pricesData));
      hasUnsavedChanges = false;
      updateUnsavedIndicator();
      renderTable();
    }

    function renderTable() {
      const container = document.getElementById('tableContainer');
      
      if (pricesData.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Нет данных о ценах</div>';
        return;
      }

      // Group by category
      const categories = {};
      pricesData.forEach(item => {
        const cat = item.category || 'main';
        if (!categories[cat]) categories[cat] = [];
        categories[cat].push(item);
      });

      let html = '<table><thead><tr><th style="width:40%">Услуга</th><th style="width:20%">Цена</th><th style="width:40%">Примечание</th></tr></thead><tbody>';

      const categoryNames = {
        'main': 'Основные услуги',
        'to': 'Техническое обслуживание',
        'diagnostics': 'Диагностика',
        'engine': 'Ремонт двигателя',
        'suspension': 'Ходовая часть',
        'brakes': 'Тормозная система',
        'transmission': 'АКПП и МКПП',
        'ac': 'Кондиционер',
        'body': 'Кузовной ремонт',
        'tires': 'Шиномонтаж',
        'polishing': 'Полировка и химчистка',
        'extras': 'Доп. оборудование',
        'wheel-alignment': 'Сход-развал'
      };

      Object.keys(categories).forEach(cat => {
        const catName = categoryNames[cat] || cat;
        html += '<tr style="background:#f8f9fa;"><td colspan="3" style="font-weight:700;font-size:15px;padding:14px 16px;"><span class="category-badge category-' + cat + '">' + catName + '</span></td></tr>';
        
        categories[cat].forEach(item => {
          html += '<tr data-id="' + item.id + '">';
          html += '<td data-label="Услуга"><input type="text" value="' + escapeHtml(item.service) + '" onchange="updateField(\'' + item.id + '\',\'service\',this.value)"></td>';
          html += '<td data-label="Цена"><input type="text" value="' + escapeHtml(item.price) + '" onchange="updateField(\'' + item.id + '\',\'price\',this.value)"></td>';
          html += '<td data-label="Примечание"><textarea rows="1" onchange="updateField(\'' + item.id + '\',\'note\',this.value)">' + escapeHtml(item.note || '') + '</textarea></td>';
          html += '</tr>';
        });
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function updateField(id, field, value) {
      const item = pricesData.find(p => p.id === id);
      if (item) {
        item[field] = value;
        checkUnsavedChanges();
      }
    }

    function checkUnsavedChanges() {
      hasUnsavedChanges = JSON.stringify(pricesData) !== JSON.stringify(originalPricesData);
      updateUnsavedIndicator();
    }

    function updateUnsavedIndicator() {
      const indicator = document.getElementById('unsavedIndicator');
      if (hasUnsavedChanges) {
        indicator.classList.add('show');
      } else {
        indicator.classList.remove('show');
      }
    }

    function savePrices() {
      const overlay = document.getElementById('loadingOverlay');
      const status = document.getElementById('saveStatus');
      const saveBtn = document.getElementById('saveBtn');
      
      overlay.classList.add('show');
      status.className = 'save-status loading';
      status.textContent = 'Сохранение...';
      saveBtn.disabled = true;

      // Сохраняем в localStorage
      try {
        localStorage.setItem('svk_prices_admin_data', JSON.stringify(pricesData));
        
        setTimeout(() => {
          overlay.classList.remove('show');
          saveBtn.disabled = false;
          
          status.className = 'save-status success';
          status.textContent = '✅ Цены успешно сохранены в localStorage!';
          originalPricesData = JSON.parse(JSON.stringify(pricesData));
          hasUnsavedChanges = false;
          updateUnsavedIndicator();
          setTimeout(() => { status.className = 'save-status'; }, 3000);
        }, 500);
      } catch (err) {
        overlay.classList.remove('show');
        saveBtn.disabled = false;
        status.className = 'save-status error';
        status.textContent = '❌ Ошибка: ' + err.message;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Keyboard shortcut: Ctrl+S to save
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if (document.getElementById('adminPanel').classList.contains('show')) {
          if (document.getElementById('pricesTab').classList.contains('active')) savePrices();
          else savePromos();
        }
      }
    });

    // ---- PROMOS ----
    const DEFAULT_PROMOS = [
      { id: "promo-1", badge: "Акция", title: "Диагностика 1 500 ₽ + мойка", price: "1 500 ₽", desc: "Комплексная диагностика автомобиля. Включено: диагностика ходовой, тормозной, компьютерная диагностика ДВС/ABS/SRS, проверка жидкостей, проверка шин. Мойка — в подарок.", link: "/contacts/", btnText: "Записаться", btnClass: "btn-primary", sort_order: 1 },
      { id: "promo-2", badge: "-30%", title: "Скидка 30% по воскресеньям", price: "", desc: "Каждое воскресенье — скидка 30% на все виды работ. Скидка не распространяется на запчасти и расходные материалы. Запись обязательна.", link: "/contacts/", btnText: "Узнать подробнее", btnClass: "btn-outline", sort_order: 2 },
      { id: "promo-3", badge: "-25%", title: "Скидка 25% за гибкое время", price: "", desc: "Запишитесь в удобное для нас время — получите скидку 25% на все виды работ. Уточните свободные окна по телефону.", link: "tel:+74957223627", btnText: "Позвонить", btnClass: "btn-outline", sort_order: 3 },
      { id: "promo-4", badge: "Комплекс", title: "После зимних дорог", price: "2 500 ₽", desc: "Комплекс «После зимы»: защитная полировка кузова + полировка фар и задних фонарей + уборка салона. Время выполнения: ~2–2,5 часа.", link: "/contacts/", btnText: "Записаться", btnClass: "btn-primary", sort_order: 4 },
    ];

    let promosData = [];
    let originalPromosData = [];

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      if (tab === 'prices') { document.getElementById('pricesTab').classList.add('active'); }
      else { document.getElementById('promosTab').classList.add('active'); loadPromos(); }
    }

    function loadPromos() {
      const container = document.getElementById('promosContainer');
      container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Загрузка...</div>';
      const saved = localStorage.getItem('svk_promo_admin_data');
      if (saved) {
        try { promosData = JSON.parse(saved); } catch { promosData = JSON.parse(JSON.stringify(DEFAULT_PROMOS)); }
      } else {
        promosData = JSON.parse(JSON.stringify(DEFAULT_PROMOS));
      }
      originalPromosData = JSON.parse(JSON.stringify(promosData));
      renderPromos();
    }

    function renderPromos() {
      const container = document.getElementById('promosContainer');
      if (promosData.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Нет акций. Нажмите «Добавить акцию».</div>';
        return;
      }
      let html = '';
      promosData.sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).forEach((p, i) => {
        html += '<div class="promo-card-edit"><div class="promo-card-header"><h4>Акция #' + (i+1) + '</h4><button class="btn-delete-promo" onclick="deletePromo(\'' + p.id + '\')">✕ Удалить</button></div>';
        html += '<div class="field-row"><div class="field"><label>Бейдж</label><select class="badge-select" onchange="updatePromoField(\'' + p.id + '\',\'badge\',this.value)"><option value="Акция"' + (p.badge==='Акция'?' selected':'') + '>Акция</option><option value="-30%"' + (p.badge==='-30%'?' selected':'') + '>-30%</option><option value="-25%"' + (p.badge==='-25%'?' selected':'') + '>-25%</option><option value="Комплекс"' + (p.badge==='Комплекс'?' selected':'') + '>Комплекс</option><option value="Новинка"' + (p.badge==='Новинка'?' selected':'') + '>Новинка</option><option value="-20%"' + (p.badge==='-20%'?' selected':'') + '>-20%</option></select></div>';
        html += '<div class="field"><label>Цена</label><input type="text" value="' + escapeHtml(p.price||'') + '" onchange="updatePromoField(\'' + p.id + '\',\'price\',this.value)" placeholder="Например: 1 500 ₽"></div></div>';
        html += '<div class="field"><label>Заголовок</label><input type="text" value="' + escapeHtml(p.title||'') + '" onchange="updatePromoField(\'' + p.id + '\',\'title\',this.value)"></div>';
        html += '<div class="field"><label>Описание</label><textarea rows="2" onchange="updatePromoField(\'' + p.id + '\',\'desc\',this.value)">' + escapeHtml(p.desc||'') + '</textarea></div>';
        html += '<div class="field-row"><div class="field"><label>Ссылка кнопки</label><input type="text" value="' + escapeHtml(p.link||'') + '" onchange="updatePromoField(\'' + p.id + '\',\'link\',this.value)"></div>';
        html += '<div class="field"><label>Текст кнопки</label><input type="text" value="' + escapeHtml(p.btnText||'') + '" onchange="updatePromoField(\'' + p.id + '\',\'btnText\',this.value)"></div></div>';
        html += '<div class="field-row"><div class="field"><label>Класс кнопки</label><select class="badge-select" onchange="updatePromoField(\'' + p.id + '\',\'btnClass\',this.value)"><option value="btn-primary"' + (p.btnClass==='btn-primary'?' selected':'') + '>Синяя</option><option value="btn-outline"' + (p.btnClass==='btn-outline'?' selected':'') + '>Белая</option></select></div>';
        html += '<div class="field"><label>Порядок</label><input type="number" value="' + (p.sort_order||0) + '" onchange="updatePromoField(\'' + p.id + '\',\'sort_order\',parseInt(this.value))"></div></div></div>';
      });
      container.innerHTML = html;
    }

    function updatePromoField(id, field, value) {
      const p = promosData.find(x => x.id === id);
      if (p) { p[field] = value; }
    }

    function addPromo() {
      const id = 'promo-' + Date.now();
      promosData.push({ id, badge: 'Акция', title: '', price: '', desc: '', link: '/contacts/', btnText: 'Подробнее', btnClass: 'btn-primary', sort_order: promosData.length + 1 });
      renderPromos();
    }

    function deletePromo(id) {
      if (!confirm('Удалить эту акцию?')) return;
      promosData = promosData.filter(p => p.id !== id);
      renderPromos();
    }

    function savePromos() {
      const overlay = document.getElementById('loadingOverlay');
      const status = document.getElementById('saveStatus');
      overlay.classList.add('show');
      status.className = 'save-status loading';
      status.textContent = 'Сохранение...';
      try {
        localStorage.setItem('svk_promo_admin_data', JSON.stringify(promosData));
        originalPromosData = JSON.parse(JSON.stringify(promosData));
        setTimeout(() => {
          overlay.classList.remove('show');
          status.className = 'save-status success';
          status.textContent = '✅ Акции сохранены!';
          setTimeout(() => { status.className = 'save-status'; }, 3000);
        }, 300);
      } catch (err) {
        overlay.classList.remove('show');
        status.className = 'save-status error';
        status.textContent = '❌ Ошибка: ' + err.message;
      }
    }
  </script>
</body>
</html>
